name: Code Quality
on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Python code
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15
          cache: 'pip'
          cache-dependency-path: src/requirements.txt

      - name: Install Python dependencies
        working-directory: src
        run: pip install -r requirements.txt

      - name: Check with ruff
        working-directory: src
        run: ruff check --output-format=github

      - name: Check with pyrefly
        working-directory: src
        run: pyrefly check

      - name: Run tests
        working-directory: src
        run: pytest

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="❌ <b>${GITHUB_WORKFLOW}</b> failed on <code>${GITHUB_REF_NAME}</code>
          <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">View run</a>"

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}"
