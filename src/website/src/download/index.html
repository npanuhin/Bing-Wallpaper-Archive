<!-- Generated by AI, edited by humans -->
<!DOCTYPE html>
<html lang="en" style="background-color: #10161f; color: #e2e8f0;">

<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="dark" name="color-scheme">
  <meta content="#10161f" name="theme-color">
  <meta
      content="Bing Wallpaper Archive > Download wallpapers by region and date range"
      name="description">
  <link href="../styles/defaults.css" rel="stylesheet">
  <link href="../styles/constants.css" rel="stylesheet">
  <link href="../styles/fonts.css" rel="stylesheet">
  <link href="../styles/footer.css" rel="stylesheet">
  <link href="./download.css" rel="stylesheet">
  <title>Download (β) — Bing Wallpaper Archive</title>
  <script>
    window.__AVG_IMAGE_SIZE_BYTES__ = {{ avg_image_size_bytes }};
  </script>
</head>

<body>

<header id="download_top_bar">
  <div class="download-top-bar-inner">
    <a
        aria-label="Back to wallpapers"
        class="download-top-back-button"
        draggable="false"
        href="/"
    >
      <inline-svg class="download-top-back-icon" src="public/icons/home.svg"></inline-svg>
    </a>
    <span class="download-top-title"><span><span class="download-title-part">Bing Wallpaper Archive</span><span class="download-title-sep"> – </span><span class="download-title-part">Download&nbsp;(β)</span></span></span>
  </div>
</header>

<div id="download_page">
  <main id="download_content">

    <!-- Region Select -->
    <div class="download-field-group">
      <div class="download-field-label">
        <span>Region</span>
      </div>
      <div class="regions-grid" id="regions_grid">
        <!-- Filled dynamically by download.ts -->
      </div>
    </div>

    <!-- Date Range with Dual Slider -->
    <div class="download-field-group">
      <div class="download-field-label">
        <span>Date Range</span>
        <div class="range-values-row">
          <input class="range-date-input" id="start_date_badge" type="text" maxlength="10" spellcheck="false" autocomplete="off" value="....-..-..">
          <span class="range-date-sep">—</span>
          <input class="range-date-input" id="end_date_badge" type="text" maxlength="10" spellcheck="false" autocomplete="off" value="....-..-..">
        </div>
      </div>

      <div class="range-slider-wrapper">
        <div id="date_range_slider"></div>
      </div>
    </div>

    <!-- Compression and Packaging Options -->
    <div class="download-field-group">
      <div class="download-field-label">
        <span>ZIP Compression Level</span>
      </div>
      <div class="single-slider-wrapper">
        <div id="compression_slider_container"></div>
        <div class="slider-ticks-grid">
          <div class="tick-col"><span class="tick-num">0</span><span class="tick-desc">Store</span></div>
          <div class="tick-col"><span class="tick-num">1</span><span class="tick-desc">Fast</span></div>
          <div class="tick-col"><span class="tick-num">2</span></div>
          <div class="tick-col"><span class="tick-num">3</span></div>
          <div class="tick-col"><span class="tick-num">4</span></div>
          <div class="tick-col"><span class="tick-num">5</span></div>
          <div class="tick-col"><span class="tick-num">6</span></div>
          <div class="tick-col"><span class="tick-num">7</span></div>
          <div class="tick-col"><span class="tick-num">8</span></div>
          <div class="tick-col"><span class="tick-num">9</span><span class="tick-desc">Max</span></div>
        </div>
      </div>
    </div>

    <!-- Estimated Items Summary -->
    <div class="summary-box">
      <div class="summary-title">Selected for download:</div>
      <div class="summary-count" id="summary_count">0 <span>wallpapers (~0 MB)</span></div>
    </div>

    <!-- Start/Cancel Actions -->
    <div class="actions-row">
      <button class="download-start-btn" id="start_btn" type="button">
        <inline-svg class="download-btn-icon" src="public/icons/download.svg"></inline-svg>
        <span id="start_btn_text">Download ZIP</span>
      </button>
      <button class="download-cancel-btn" id="cancel_btn" type="button">Cancel</button>
    </div>

    <!-- Progress Panel -->
    <div class="progress-panel" id="progress_panel">
      <div class="progress-header">
        <span class="progress-status-text" id="progress_status">Preparing...</span>
        <span class="progress-percentage" id="progress_percentage">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress_fill"></div>
      </div>
      <div class="progress-stats-row">
        <span id="progress_items">0 / 0 images</span>
        <span id="progress_bytes">0 MB saved</span>
      </div>
    </div>

  </main>
</div>

<footer id="footer">
  <a
      draggable="false"
      href="/status"
  >
    <inline-svg class="footer-icon" src="public/icons/status.svg"></inline-svg>
    <span>Status&nbsp;(β)</span>
  </a>
  <a
      draggable="false"
      href="https://github.com/npanuhin/Bing-Wallpaper-Archive"
      rel="noopener"
      target="_blank"
  >
    <inline-svg class="footer-icon" src="public/icons/GitHub.svg"></inline-svg>
    <span>npanuhin/Bing-Wallpaper-Archive</span>
  </a>
</footer>

<script src="./download.ts" type="module"></script>
</body>

</html>
