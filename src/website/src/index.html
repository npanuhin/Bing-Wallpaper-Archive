<!DOCTYPE html>
<!--suppress HtmlUnknownTarget, HtmlRequiredAltAttribute -->
<html lang="en">

<head>
  <link
      as="font"
      crossorigin
      href="/fonts/MiSans Latin/MiSansLatin-Regular.woff2"
      rel="preload"
      type="font/woff2">
  <link
      as="font"
      crossorigin
      href="/fonts/Segoe UI/SegoeUI-Regular.woff2"
      rel="preload"
      type="font/woff2">

  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta
      content="Explore the Bing Wallpaper Archive, a complete collection of daily Bing wallpapers from around the world"
      name="description">
  <link href="styles/defaults.css" rel="stylesheet">
  <link href="styles/constants.css" rel="stylesheet">
  <link href="styles/fonts.css" rel="stylesheet">
  <link href="styles/home.css" rel="stylesheet">
  <title>Bing Wallpaper Archive</title>
</head>

<body>

<div id="slideshow">
  <!-- Images change is done by switching opacity on/off on background2 -->
  <img id="slideshow_image_background">
  <img alt="{initial_title}" data-real-image="{initial_image_url}" id="slideshow_image_foreground"
       src="assets/initial-image.jpg">

  <!--<svg id="timer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">-->

  <!--</svg>-->
</div>

<div id="slideshow_title_container">
  <a draggable="false" href="{initial_image_url}" id="slideshow_title" rel="noopener" target="_blank">
    <span class="font-title">{initial_title}</span>
  </a>
</div>

<div id="content">
  <div id="header">
    <h1 class="font-title">Bing Wallpaper Archive</h1>
  </div>

  <!--		<a draggable="false" data-mkt="CA-fr" href="#CA-fr" class="market">Canada (French)</a>-->
  <!--		<a draggable="false" data-mkt="IT-it" href="#IT-it" class="market">Italy</a>-->
  <!--		<a draggable="false" data-mkt="ES-es" href="#ES-es" class="market">Spain</a>-->
  <!--		<a draggable="false" data-mkt="FR-fr" href="#FR-fr" class="market">France</a>-->
  <!--		<a draggable="false" data-mkt="DE-de" href="#DE-de" class="market">Germany</a>-->
  <!--		<a draggable="false" data-mkt="IN-en" href="#IN-en" class="market">India</a>-->
  <!--		<a draggable="false" data-mkt="CN-zh" href="#CN-zh" class="market">China</a>-->
  <!--		<a draggable="false" data-mkt="JP-ja" href="#JP-ja" class="market">Japan</a>-->
  <!--		<a draggable="false" data-mkt="BR-pt" href="#BR-pt" class="market">Brazil</a>-->
  <!--		<a draggable="false" data-mkt="ROW-en" href="#ROW-en" class="market market-row">International</a>-->
  <!--	</div>-->

  <div id="content_inner">

    <div id="cur_image">
      <img alt="{initial_title}" id="cur_image_real">
      <img alt="{initial_title}" id="cur_image_initial" src="assets/initial-image.jpg">
    </div>

    <div id="cur_image_info">
      <h2 class="font-title" id="cur_image_title">{initial_title}</h2>
      <div id="cur_image_description">{initial_description}</div>
    </div>
  </div>

  <footer id="footer">
    <a
        draggable="false"
        href="https://github.com/npanuhin/Bing-Wallpaper-Archive"
        rel="noopener"
        target="_blank"
    >
      <span id="footer_icon"></span>
      <span>npanuhin/Bing-Wallpaper-Archive</span>
    </a>
  </footer>
</div>

<script src="/scripts/home.ts" type="module"></script>
